name: Deploy Open Data site
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: corepack enable yarn
      - run: yarn --frozen-lockfile
      - run: yarn build:site
      - run: yarn check:site
      - run: yarn test:site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
