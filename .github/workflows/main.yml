name: Data generation

on:
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Publish a new version even when data/ has not changed'
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'

permissions:
  id-token: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.MAIN_PUSH_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
      - name: Enable corepack
        run: corepack enable yarn
      # npm@latest is 12.x, which requires node >= 22.22.2. Pinned to 11.x,
      # the last line that runs on node 20 while satisfying the npm >= 11.5.1
      # that OIDC trusted publishing needs. Drop the pin once .nvmrc moves off
      # node 20.
      - name: Upgrade npm for OIDC
        run: npm install -g npm@11
      - run: git config user.name "GitHub Actions Bot"
      - run: git config user.email "<>"
      - run: yarn --frozen-lockfile
      - run: yarn build
      - name: Version, push & publish if changes
        if: github.ref == 'refs/heads/main'
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          set -e
          git add data/
          if git diff --cached --quiet; then
            if [ "$FORCE_PUBLISH" != "true" ]; then
              echo "No changes detected → no version bump, no publish"
              exit 0
            fi
            echo "No data change, but force_publish requested → publish anyway"
          else
            echo "Changes detected → commit generated data"
            git commit -m "chore: update generated data"
          fi
          echo "Bump version"
          npm version patch
          echo "Push commits and tags"
          git push origin HEAD
          git push origin --tags
          echo "Publish to npm"
          npm publish --access public
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./site/dist"
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
